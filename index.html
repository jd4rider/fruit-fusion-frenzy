<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Fruit Fusion Frenzy — drop juicy fruit, fuse matching pairs and unleash chain reactions in a physics puzzle built for Little Joy Arcade."
    />
    <meta name="theme-color" content="#0b1826" />
    <meta property="og:title" content="Fruit Fusion Frenzy" />
    <meta property="og:description" content="Drop it. Merge it. Unleash the frenzy!" />
    <meta property="og:type" content="website" />
    <title>Fruit Fusion Frenzy — Little Joy Arcade</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1826;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
        touch-action: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main id="game" aria-label="Fruit Fusion Frenzy game canvas" role="application"></main>
    <p id="game-status" class="sr-only" aria-live="polite"></p>
    <noscript>Fruit Fusion Frenzy needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.ts"></script>
    <script src="./arcade-client.js" data-game-id="fruit-fusion-frenzy"></script>
  </body>
</html>
